name: Apply uploaded Forestville video

on:
  push:
    branches:
      - forestville-video-binary-fix-2

permissions:
  contents: write

concurrency:
  group: forestville-uploaded-video
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Fetch and reconstruct uploaded video
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/video_thumbnail.mp4"
          : > "$output"
          parts=(00 01 02 03 04 05 06 07 08 09 10 11 120 121 122 123 13 14 15 16)
          for i in "${parts[@]}"; do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.raw+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/.tmp/fv-upload/part${i}.bin?ref=${GITHUB_SHA}" \
              >> "$output"
          done

          test "$(stat -c%s "$output")" = "101274"
          test "$(sha256sum "$output" | awk '{print $1}')" = "c375bd62f4061ee268c6dbc3b1415ae2c2d598a9210bb5f82db1b71a61939544"

          codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$output")"
          pix_fmt="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 "$output")"
          tag="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_tag_string -of default=nw=1:nk=1 "$output")"
          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$output")"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$output")"
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$output")"

          test "$codec" = "h264"
          test "$pix_fmt" = "yuv420p"
          test "$tag" = "avc1"
          test "$width" = "192"
          test "$height" = "108"
          awk -v d="$duration" 'BEGIN { exit !(d > 31 && d < 32) }'
          ffmpeg -v error -i "$output" -f null -
          echo "Validated uploaded Forestville video."

      - name: Commit uploaded Forestville video to main
        shell: bash
        run: |
          set -euo pipefail
          target="presentation/forestville/assets/video_thumbnail.mp4"
          output="${RUNNER_TEMP}/video_thumbnail.mp4"
          metadata="${RUNNER_TEMP}/target.json"
          response="${RUNNER_TEMP}/update.json"
          payload="${RUNNER_TEMP}/payload.json"
          encoded_file="${RUNNER_TEMP}/video.b64"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/${target}?ref=main" \
            --output "$metadata"

          current_sha="$(jq -r '.sha' "$metadata")"
          base64 -w 0 "$output" > "$encoded_file"

          jq -n \
            --arg message "Use uploaded Forestville video thumbnail" \
            --rawfile content "$encoded_file" \
            --arg sha "$current_sha" \
            --arg branch "main" \
            '{message:$message, content:$content, sha:$sha, branch:$branch}' > "$payload"

          curl --fail-with-body --silent --show-error \
            --request PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/${target}" \
            --data-binary @"$payload" \
            --output "$response"

          commit_sha="$(jq -r '.commit.sha' "$response")"
          new_sha="$(jq -r '.content.sha' "$response")"
          echo "Committed uploaded Forestville video to main: ${commit_sha}; blob ${new_sha}"

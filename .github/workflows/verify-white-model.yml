name: Verify white model deployment
on:
  push:
    branches: [codex/fix-white-model-deployment]
    paths: ['.github/workflows/verify-white-model.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Apply scoped publishing corrections
        run: |
          test "$GITHUB_REF_NAME" = codex/fix-white-model-deployment
          python3 - <<'PY'
          from pathlib import Path
          import json
          def patch(file, old, new):
              p=Path(file)
              text=p.read_text()
              if new in text:
                  return
              assert text.count(old)==1, (file, 'ambiguous patch anchor', text.count(old))
              p.write_text(text.replace(old,new,1))
          patch('scripts/dist-config.js',
              "    const isSiteFeasibility = presentationDir === 'presentation/site_feasibility';",
              "    const isSiteFeasibility = presentationDir === 'presentation/site_feasibility';\n    const isWhiteModel = presentationDir === 'presentation/white_model';")
          patch('scripts/dist-config.js',
              "        if (entry.isFile()) {\n            const extension = path.extname(entry.name).toLowerCase();",
              "        if (entry.isFile()) {\n            // Retain the original GLB in Git; publish its lossless split glTF instead.\n            if (isWhiteModel && entry.name === 'model.glb') continue;\n            const extension = path.extname(entry.name).toLowerCase();")
          patch('scripts/dist-config.js',
              "        if (isSiteFeasibility && entry.isDirectory() && ['_next', 'development'].includes(entry.name)) {",
              "        if (entry.isDirectory() && (\n            (isSiteFeasibility && ['_next', 'development'].includes(entry.name))\n            || (isWhiteModel && entry.name === 'vendor')\n        )) {")
          patch('scripts/verify-dist.js',
              "    if (candidate.endsWith('/')) return `${candidate}index.html`;",
              "    // path.normalize('/') becomes '.' after removing the site-root slash.\n    if (candidate === '.') return 'index.html';\n    if (candidate.endsWith('/')) return `${candidate}index.html`;")
          patch('presentation/white_model/index.html',
              "        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';",
              "        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';\n        import { createMaterialConverter } from './materials.js';")
          patch('presentation/white_model/index.html',
              "            modelObject.traverse(n => {",
              "            const convertMaterial = createMaterialConverter(THREE, config);\n            modelObject.traverse(n => {")
          p=Path('presentation/white_model/index.html')
          text=p.read_text()
          start=text.find('                    if(!(n.material instanceof THREE.MeshPhysicalMaterial)) {')
          if start>=0:
              end=text.index('                    if(config.edgeVisible) {', start)
              text=text[:start]+'                    n.material = convertMaterial(n.material);\n'+text[end:]
              p.write_text(text)
          assert 'n.material = convertMaterial(n.material);' in p.read_text()
          p=Path('package.json')
          data=json.loads(p.read_text())
          data['scripts']['prepare:white-model']='node scripts/prepare-white-model.js'
          data['scripts']['test:white-model']='node --test scripts/test-white-model.js scripts/test-white-model-materials.mjs'
          data['scripts']['test:cloudflare']='node scripts/test-cloudflare.js && npm run test:white-model'
          p.write_text(json.dumps(data,indent=2)+'\n')
          patch('DEPLOYMENT.md', '## Routine portfolio update',
              "`presentation/white_model/` publishes its local `vendor/` runtime dependencies and `model.gltf` with buffers below 20 MiB. The original `model.glb` remains in Git as an authoring source and is excluded from `dist/`. After replacing that source, run `npm run prepare:white-model` and commit the regenerated `model.gltf`, `model-part-*.bin`, and viewer URL alongside the source. Packaging preserves every buffer-view byte and all scene properties; `npm run check:update` includes model preservation, Khronos validation, material conversion, and runtime-inventory regression tests.\n\n## Routine portfolio update")
          PY
          node scripts/prepare-white-model.js
      - run: npm ci
      - run: npm run check:update
      - run: git diff --check
      - name: Install isolated browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/white-model-browser" --no-package-lock --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/white-model-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser checks on production artifact
        run: |
          python3 -m http.server 4173 --directory dist > "$RUNNER_TEMP/white-model-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/white-model-browser/node_modules/playwright/index.mjs"
          mkdir -p /tmp/white-model-verification
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const { chromium } = await import(process.env.PLAYWRIGHT_MODULE);
          const browser = await chromium.launch({args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          try {
              for (const [name, viewport, suffix] of [['desktop',{width:1440,height:900},''], ['mobile',{width:390,height:844},'/']]) {
                  const context = await browser.newContext({viewport,deviceScaleFactor:1,hasTouch:name==='mobile',isMobile:name==='mobile'});
                  const page = await context.newPage();
                  const errors=[];
                  const failed=[];
                  const completed=new Set();
                  const modelResponses=[];
                  page.on('pageerror',e=>errors.push(e.message));
                  page.on('console',m=>{if(m.type()==='error') errors.push(m.text());});
                  page.on('requestfailed',r=>failed.push({url:r.url(),method:r.method(),error:r.failure()?.errorText}));
                  page.on('requestfinished',r=>{if(r.method()==='GET') completed.add(r.url());});
                  page.on('response',r=>{
                      if(r.status()>=400) errors.push(`${r.status()} ${r.url()}`);
                      if(/model(?:\.gltf|-part-\d+\.bin)(?:\?|$)/.test(r.url())) modelResponses.push([r.url(),r.status(),r.request().method()]);
                  });
                  const response=await page.goto(`http://127.0.0.1:4173/presentation/white_model${suffix}`,{waitUntil:'domcontentloaded'});
                  assert.equal(response.status(),200);
                  await page.waitForFunction(()=>{
                      const e=document.querySelector('#loading-overlay');
                      return !e || getComputedStyle(e).display==='none' || Number(getComputedStyle(e).opacity)===0;
                  },null,{timeout:60000});
                  await page.waitForLoadState('networkidle');
                  await page.screenshot({path:`/tmp/white-model-verification/${name}.png`});
                  assert.equal(await page.locator('#boot-error').isVisible(),false,await page.locator('#boot-error').innerText());
                  assert(await page.locator('#canvas-container canvas').count()>0,'3D canvas missing');
                  assert(modelResponses.some(([u,s,m])=>u.endsWith('model.gltf') && s===200 && m==='GET' && completed.has(u)),'glTF GET not completed');
                  assert(modelResponses.filter(([u,s])=>u.endsWith('.bin') && s===200 && completed.has(u)).length>=2,'Split buffers not fully loaded');
                  // Exports with no saved bookmarks intentionally hide Views.
                  if(await page.locator('#view-toggle').isVisible()) {
                      await page.locator('#view-toggle').click();
                      assert(await page.locator('#view-panel').isVisible(),'View controls did not open');
                      if(await page.locator('#view-reset').isEnabled()) await page.locator('#view-reset').click();
                  }
                  await page.evaluate(()=>window.resetOrFitView());
                  await page.mouse.move(viewport.width/2,viewport.height/2);
                  await page.mouse.down();
                  await page.mouse.move(viewport.width/2+40,viewport.height/2+20,{steps:5});
                  await page.mouse.up();
                  await page.mouse.wheel(0,80);
                  // Accept an availability-probe abort only after the actual GET completed.
                  for (const request of failed) {
                      if(request.error==='net::ERR_ABORTED' && request.url.endsWith('/model.gltf') && completed.has(request.url)) {
                          console.log('Completed model load superseded availability probe',request.method,request.url);
                      } else errors.push(JSON.stringify(request));
                  }
                  assert.deepEqual(errors,[],`${name} console/network errors`);
                  const icon=await context.request.get('http://127.0.0.1:4173/assets/favicon.png');
                  assert.equal(icon.status(),200);
                  assert.equal(await page.locator('#boot-error').isVisible(),false);
                  console.log('BROWSER PASS',name,page.url(),JSON.stringify(modelResponses));
                  await context.close();
              }
          } finally {await browser.close();}
          JS
      - name: Commit verified source and generated model assets to repair branch
        run: |
          test "$GITHUB_REF_NAME" = codex/fix-white-model-deployment
          git diff --stat
          git diff -- scripts/dist-config.js scripts/verify-dist.js package.json DEPLOYMENT.md presentation/white_model/index.html
          git add -- scripts/dist-config.js scripts/verify-dist.js package.json DEPLOYMENT.md presentation/white_model/index.html presentation/white_model/model.gltf presentation/white_model/model-part-*.bin
          git add -- index.html gallery-data.js script.js script.min.js styles.min.css presentation/cinematic_web_presentation/index.html presentation/forestville_test/index.html sitemap.xml robots.txt projects/
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
              git commit -m 'fix: publish white model viewer with lossless split assets'
              git push origin HEAD:codex/fix-white-model-deployment
          fi
          git status --short
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: white-model-browser-verification
          path: /tmp/white-model-verification/
          if-no-files-found: ignore

name: Validate Cloudflare build fix

on:
  push:
    branches:
      - fix/forestville-cloudflare-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run production-equivalent build and regression tests
        run: npm run check:update

name: Apply Forestville video fix

on:
  push:
    branches:
      - forestville-video-binary-fix-2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forestville-video-repair
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Fetch current thumbnail only
        shell: bash
        run: |
          set -euo pipefail

          source_path="presentation/forestville/assets/video_thumbnail.mp4"
          input="${RUNNER_TEMP}/video_thumbnail-source.mp4"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/${source_path}?ref=${GITHUB_SHA}" \
            --output "$input"

          test -s "$input"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=nw=1 "$input"

      - name: Re-encode thumbnail for browser playback
        shell: bash
        run: |
          set -euo pipefail

          input="${RUNNER_TEMP}/video_thumbnail-source.mp4"
          output="${RUNNER_TEMP}/video_thumbnail.mp4"

          ffmpeg -hide_banner -loglevel warning -y \
            -i "$input" \
            -map 0:v:0 \
            -an \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -profile:v high \
            -level:v 4.0 \
            -tag:v avc1 \
            -preset medium \
            -crf 23 \
            -movflags +faststart \
            "$output"

          test -s "$output"

          codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$output")"
          pix_fmt="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 "$output")"
          codec_tag="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_tag_string -of default=nw=1:nk=1 "$output")"
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$output")"
          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$output")"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$output")"

          test "$codec" = "h264"
          test "$pix_fmt" = "yuv420p"
          test "$codec_tag" = "avc1"
          awk -v d="$duration" 'BEGIN { exit !(d > 0) }'
          test "$width" -gt 0
          test "$height" -gt 0

          # Decode the complete repaired file so corruption/truncation fails here.
          ffmpeg -v error -i "$output" -f null -

          size="$(stat -c%s "$output")"
          sha256="$(sha256sum "$output" | awk '{print $1}')"
          echo "Validated browser-safe Forestville video: ${width}x${height}, ${duration}s, ${size} bytes, sha256 ${sha256}"

      - name: Commit validated video to main through GitHub API
        shell: bash
        run: |
          set -euo pipefail

          target="presentation/forestville/assets/video_thumbnail.mp4"
          output="${RUNNER_TEMP}/video_thumbnail.mp4"
          metadata="${RUNNER_TEMP}/target.json"
          response="${RUNNER_TEMP}/update.json"
          payload="${RUNNER_TEMP}/payload.json"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/${target}?ref=main" \
            --output "$metadata"

          current_sha="$(jq -r '.sha' "$metadata")"
          repaired_sha="$(git hash-object "$output")"

          if [ "$current_sha" = "$repaired_sha" ]; then
            echo "Forestville thumbnail on main already matches the validated repaired video."
            exit 0
          fi

          encoded="$(base64 -w 0 "$output")"
          jq -n \
            --arg message "Replace Forestville thumbnail with browser-safe H.264 video" \
            --arg content "$encoded" \
            --arg sha "$current_sha" \
            --arg branch "main" \
            '{message:$message, content:$content, sha:$sha, branch:$branch}' > "$payload"

          curl --fail-with-body --silent --show-error \
            --request PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/${target}" \
            --data-binary @"$payload" \
            --output "$response"

          commit_sha="$(jq -r '.commit.sha' "$response")"
          new_blob_sha="$(jq -r '.content.sha' "$response")"
          test "$new_blob_sha" = "$repaired_sha"
          echo "Committed repaired Forestville thumbnail to main: ${commit_sha}"

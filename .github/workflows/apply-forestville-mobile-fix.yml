name: Apply Forestville mobile landscape fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-forestville-mobile-fix.yml'
      - 'build.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forestville-mobile-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply idempotent Forestville mobile fix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const target = path.join('presentation', 'forestville_test', 'index.html');
          let html = fs.readFileSync(target, 'utf8');
          const start = '<!-- FORESTVILLE_MOBILE_LANDSCAPE_FIX_START -->';
          const end = '<!-- FORESTVILLE_MOBILE_LANDSCAPE_FIX_END -->';
          const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const existing = new RegExp('\\s*' + escapeRegExp(start) + '[\\s\\S]*?' + escapeRegExp(end) + '\\s*', 'g');
          html = html.replace(existing, '\n');

          const patch = `
          ${start}
          <style>
            #requestLandscapeButton {
              width: 168px;
              min-width: 168px;
              justify-content: center;
            }
          </style>
          <script>
            (() => {
              const button = document.getElementById('requestLandscapeButton');
              const label = button?.querySelector('span');
              if (!button || !label) return;

              const resetLandscapeButton = () => {
                if (!window.matchMedia('(orientation: portrait)').matches) return;
                label.textContent = 'VIEW LANDSCAPE';
                button.setAttribute('aria-label', 'View landscape fullscreen');
                button.disabled = false;
              };

              const scheduleReset = () => {
                window.requestAnimationFrame(() => {
                  window.setTimeout(resetLandscapeButton, 0);
                });
              };

              window.addEventListener('orientationchange', scheduleReset, { passive: true });
              document.addEventListener('fullscreenchange', scheduleReset);
              if (screen.orientation && typeof screen.orientation.addEventListener === 'function') {
                screen.orientation.addEventListener('change', scheduleReset);
              }
              window.addEventListener('pageshow', scheduleReset, { passive: true });
            })();
          <\/script>
          ${end}`;

          if (!html.includes('</body>')) throw new Error('Forestville export is missing </body>.');
          html = html.replace('</body>', patch + '\n  </body>');
          fs.writeFileSync(target, html);
          NODE

      - name: Commit patched export when needed
        shell: bash
        run: |
          if git diff --quiet -- presentation/forestville_test/index.html; then
            echo "Forestville export already contains the fix."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentation/forestville_test/index.html
          git commit -m "Apply Forestville mobile landscape fix"
          git push origin HEAD:main

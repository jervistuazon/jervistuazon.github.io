name: Apply Forestville mobile fix and cache busting

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-forestville-mobile-fix.yml'
      - 'build.js'
      - 'presentation/forestville_test/index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forestville-mobile-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply idempotent Forestville mobile fix and cache version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const target = path.join('presentation', 'forestville_test', 'index.html');
          let html = fs.readFileSync(target, 'utf8');
          const start = '<!-- FORESTVILLE_MOBILE_LANDSCAPE_FIX_START -->';
          const end = '<!-- FORESTVILLE_MOBILE_LANDSCAPE_FIX_END -->';
          const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const existing = new RegExp('\\s*' + escapeRegExp(start) + '[\\s\\S]*?' + escapeRegExp(end) + '\\s*', 'g');

          // Remove our injected block before hashing so repeated runs are idempotent.
          html = html.replace(existing, '\n');

          // Bump this whenever the injected runtime behavior changes so fixes get
          // a fresh URL even when the underlying Forestville export is unchanged.
          const patchRevision = 'mobile-ui-v3';
          const cacheVersion = crypto
            .createHash('sha256')
            .update(patchRevision + '\0' + html)
            .digest('hex')
            .slice(0, 12);

          const patch = `
          ${start}
          <style>
            #rotateDeviceFallback {
              --mobile-ui-scale: 1;
              transform: translateX(-50%) scale(var(--mobile-ui-scale)) !important;
              transform-origin: 50% 100%;
            }

            #requestLandscapeButton {
              box-sizing: border-box;
              width: 168px;
              min-width: 168px;
              max-width: 168px;
              height: 42px;
              min-height: 42px;
              max-height: 42px;
              flex: 0 0 168px;
              justify-content: center;
              gap: 8px;
              padding: 9px 14px 9px 11px;
              font-size: 11.2px;
              line-height: 1;
              -webkit-text-size-adjust: 100%;
              text-size-adjust: 100%;
            }

            #requestLandscapeButton .rotate-device-icon {
              width: 20px;
              min-width: 20px;
              max-width: 20px;
              height: 20px;
              min-height: 20px;
              max-height: 20px;
              flex: 0 0 20px;
            }
          </style>
          <script>
            (() => {
              const cacheVersion = '${cacheVersion}';
              const currentUrl = new URL(window.location.href);
              if (currentUrl.searchParams.get('v') !== cacheVersion) {
                currentUrl.searchParams.set('v', cacheVersion);
                window.location.replace(currentUrl.toString());
                return;
              }

              const overlay = document.getElementById('rotateDeviceFallback');
              const button = document.getElementById('requestLandscapeButton');
              const label = button?.querySelector('span');
              if (!overlay || !button || !label) return;

              let settleTimers = [];

              const isPortrait = () =>
                window.matchMedia('(orientation: portrait)').matches;

              const syncLandscapeControl = () => {
                if (!isPortrait()) return;

                label.textContent = 'VIEW LANDSCAPE';
                button.setAttribute('aria-label', 'View landscape fullscreen');
                button.disabled = false;

                // Fullscreen/orientation transitions can return to portrait with
                // visualViewport.scale still changed. Counter-scale this fixed UI
                // only, preserving the same physical size as the initial render.
                const visualScale = Number(window.visualViewport?.scale) || 1;
                const compensation = Math.min(2, Math.max(0.5, 1 / visualScale));
                overlay.style.setProperty('--mobile-ui-scale', String(compensation));
              };

              const scheduleSync = () => {
                settleTimers.forEach(window.clearTimeout);
                settleTimers = [];

                syncLandscapeControl();
                window.requestAnimationFrame(syncLandscapeControl);

                // Mobile browsers settle fullscreen, orientation, browser chrome
                // and visualViewport in separate passes, so re-check each phase.
                [50, 150, 300, 600].forEach((delay) => {
                  settleTimers.push(window.setTimeout(syncLandscapeControl, delay));
                });
              };

              window.addEventListener('resize', scheduleSync, { passive: true });
              window.addEventListener('orientationchange', scheduleSync, { passive: true });
              document.addEventListener('fullscreenchange', scheduleSync);
              window.visualViewport?.addEventListener('resize', scheduleSync, { passive: true });
              window.visualViewport?.addEventListener('scroll', scheduleSync, { passive: true });

              if (screen.orientation && typeof screen.orientation.addEventListener === 'function') {
                screen.orientation.addEventListener('change', scheduleSync);
              }

              window.addEventListener('pageshow', scheduleSync, { passive: true });
              scheduleSync();
            })();
          <\/script>
          ${end}`;

          if (!html.includes('</body>')) {
            throw new Error('Forestville export is missing </body>.');
          }

          html = html.replace('</body>', patch + '\n  </body>');
          fs.writeFileSync(target, html);
          console.log(`Forestville cache version: ${cacheVersion}`);
          NODE

      - name: Commit patched export when needed
        shell: bash
        run: |
          if git diff --quiet -- presentation/forestville_test/index.html; then
            echo "Forestville export already contains the current fix and cache version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentation/forestville_test/index.html
          git commit -m "Fix Forestville mobile button scale after landscape"
          git push origin HEAD:main

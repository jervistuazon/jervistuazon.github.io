name: Sync oversized portfolio media to R2

on:
  push:
    branches:
      - main
    paths:
      - 'assets/**/*.avi'
      - 'assets/**/*.mkv'
      - 'assets/**/*.mov'
      - 'assets/**/*.mp4'
      - 'assets/**/*.webm'
      - 'presentation/**/*.avi'
      - 'presentation/**/*.mkv'
      - 'presentation/**/*.mov'
      - 'presentation/**/*.mp4'
      - 'presentation/**/*.webm'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-r2-media-production
  cancel-in-progress: false

jobs:
  sync:
    name: Upload changed oversized videos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use the repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Sync oversized source media
        run: node scripts/sync-r2-media.js
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          R2_MEDIA_BUCKET: portfolio-media-production


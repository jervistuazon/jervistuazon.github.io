        async function assertAssetAvailable(path, label = 'asset') {

                if (!response.ok) {
                    throw new Error(`${label} not found (${response.status})`);

                lastCardTop = -9999;
                if (!placePopup()) return;
                remaining -= 1;
                if (remaining <= 0) {
                    revealPopup();
                }
            };

            pendingMedia.forEach((node) => {
                if (node.tagName === 'IMG') {
                    node.addEventListener('load', onMediaSettled, { once: true });
                    node.addEventListener('error', onMediaSettled, { once: true });
                } else if (node.tagName === 'VIDEO') {
                    node.addEventListener('loadedmetadata', onMediaSettled, { once: true });
                    node.addEventListener('error', onMediaSettled, { once: true });
                }
            });

            // Avoid long hidden state when media metadata is slow.
            setTimeout(revealPopup, 220);
        }

        function closeHotspotPopup(hotspotForOrigin) {
            const card = document.getElementById('hotspot-card');
            if (!card) {
                activeHotspot = null;
                cachedCardHeight = 0;
                lastCardLeft = -9999;
                lastCardTop = -9999;
                return;
            }

            const originHotspot = hotspotForOrigin || activeHotspot;
            if (!card.classList.contains('visible') && !card.classList.contains('closing')) {
                popupOpenToken += 1;
                activeHotspot = null;
                cachedCardHeight = 0;
                lastCardLeft = -9999;
                lastCardTop = -9999;
                return;
            }

            updateHotspotPos(originHotspot);
            setPopupTransformOrigin(originHotspot);
            card.classList.remove('visible');
            card.classList.add('closing');
            popupOpenToken += 1;
            activeHotspot = null;
            cachedCardHeight = 0;
            lastCardLeft = -9999;
            lastCardTop = -9999;

            if (popupCloseTimer) {
                clearTimeout(popupCloseTimer);
            }
            popupCloseTimer = setTimeout(() => {
                card.classList.remove('closing');
                popupCloseTimer = null;
            }, popupAnimationDurationMs);
        }
        
        function closeFullscreenMedia() {
            const overlay = document.getElementById('fullscreen-media-overlay');
            const contentContainer = document.getElementById('fullscreen-media-content');
            if (!overlay || !fullscreenMediaActive) return;
            fullscreenMediaActive = false;
            if (contentContainer) contentContainer.classList.add('closing');
            overlay.classList.remove('visible');
            setTimeout(() => {
                if (contentContainer) {
                    contentContainer.classList.remove('closing');
                    contentContainer.textContent = '';
                }
            }, 500);
        }
        
        function openFullscreenMedia(hotspot, markerScreenPos) {
            const overlay = document.getElementById('fullscreen-media-overlay');
            const contentContainer = document.getElementById('fullscreen-media-content');
            if (!overlay || !contentContainer) return false;
            
            // Check if hotspot has media
            const content = hotspot.content || '';
            if (!content.includes('<img') && !content.includes('<video')) return false;
            
            fullscreenMediaActive = true;
            
            // Set transform origin from marker position
            if (markerScreenPos) {
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                contentContainer.style.setProperty('--origin-x', 'calc(50% + ' + (markerScreenPos.x - centerX) + 'px)');
                contentContainer.style.setProperty('--origin-y', 'calc(50% + ' + (markerScreenPos.y - centerY) + 'px)');
            }
            
            // Extract and display media
            const srcMatch = content.match(/src="([^"]+)"/);
            const mediaSrc = srcMatch ? srcMatch[1] : null;
            if (mediaSrc) {
                const isVideo = content.includes('<video');
                contentContainer.textContent = '';
                if (isVideo) {
                    const video = document.createElement('video');
                    video.src = mediaSrc;
                    video.controls = true;
                    video.autoplay = true;
                    video.loop = true;
                    video.style.outline = 'none';
                    contentContainer.appendChild(video);
                } else {
                    const image = document.createElement('img');
                    image.src = mediaSrc;
                    image.alt = 'Hotspot media';
                    contentContainer.appendChild(image);
                }
            }
            
            contentContainer.classList.remove('closing');
            overlay.classList.add('visible');
            
            // Add close button click handler
            const closeBtn = document.getElementById('fullscreen-media-close');
            if (closeBtn) closeBtn.onclick = closeFullscreenMedia;
            
            // Add backdrop click to close (clicking outside the media)
            overlay.onclick = function(e) {
                if (e.target === overlay) closeFullscreenMedia();
            };
            
            return true;
        }
        
        window.addEventListener('keydown', (e) => { 
            if(e.key === 'Escape') { 
                if (fullscreenMediaActive) {
                    closeFullscreenMedia();
                    return;
                }
                closeHotspotPopup();
                if (window.closeScenicView) window.closeScenicView();
                if (window.closePanoramicView) window.closePanoramicView();
            } else if (!e.ctrlKey && !e.metaKey && !e.altKey && (e.key === 'z' || e.key === 'Z' || e.key === 'f' || e.key === 'F')) {
                if (document.activeElement instanceof HTMLInputElement ||
                    document.activeElement instanceof HTMLTextAreaElement ||
                    (document.activeElement && document.activeElement.isContentEditable)) {
                    return;
                }
                if (typeof window.resetOrFitView === 'function') {
                    e.preventDefault();
                    window.resetOrFitView();
                }
            } else if (!e.ctrlKey && !e.metaKey && !e.altKey && (['1', '2', '3', '4'].includes(e.key) || /^Numpad([1-4])$/.test(e.code))) {
                if (document.activeElement instanceof HTMLInputElement ||
                    document.activeElement instanceof HTMLTextAreaElement ||
                    document.activeElement instanceof HTMLSelectElement ||
                    (document.activeElement && document.activeElement.isContentEditable) ||
                    (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT' || e.target.isContentEditable))) {
                    return;
                }
                const numpadMatch = /^Numpad([1-4])$/.exec(e.code);
                const speedVal = ['1', '2', '3', '4'].includes(e.key) ? Number(e.key) : Number(numpadMatch[1]);
                e.preventDefault();
                setNavigationSpeed(speedVal);
            }
        });

        var speedToastTimeout = null;
        function setNavigationSpeed(level, showToast = true) {
            const num = Math.max(1, Math.min(4, Math.round(Number(level) || 2)));
            const SPEED_PRESETS = {
                1: { mult: 0.25, label: '0.25x (Precision)' },
                2: { mult: 0.5, label: '0.5x (Normal)' },
                3: { mult: 1.0, label: '1x (Fast)' },
                4: { mult: 2.0, label: '2x (Turbo)' }
            };
            const preset = SPEED_PRESETS[num] || SPEED_PRESETS[2];

            if (typeof controls !== 'undefined' && controls) {
                controls.rotateSpeed = 0.8 * preset.mult;
                controls.panSpeed = 0.8 * preset.mult;
                controls.zoomSpeed = 0.8 * preset.mult;
            }
            if (typeof smoothZoom !== 'undefined' && smoothZoom && typeof smoothZoom.setSpeedMultiplier === 'function') {
                smoothZoom.setSpeedMultiplier(preset.mult);
            }
            if (typeof cameraController !== 'undefined' && cameraController && typeof cameraController.setSpeedMultiplier === 'function') {
                cameraController.setSpeedMultiplier(preset.mult);
            }

            if (showToast) {
                const toast = document.getElementById('nav-speed-toast');
                const text = document.getElementById('nav-speed-toast-text');
                if (toast && text) {
                    text.textContent = 'Speed: ' + preset.label;
                    toast.classList.add('visible');
                    clearTimeout(speedToastTimeout);
                    speedToastTimeout = setTimeout(() => {
                        toast.classList.remove('visible');
                    }, 1300);
                }
            }
            return preset;
        }
        window.setNavigationSpeed = setNavigationSpeed;

        window.addEventListener('resize', () => { 
            cachedCardHeight = 0;
            lastCardLeft = -9999;
            lastCardTop = -9999;
            if (camera) {
                camera.aspect = window.innerWidth / window.innerHeight; 
                camera.updateProjectionMatrix(); 
            }
            if (renderer) renderer.setSize(window.innerWidth, window.innerHeight); 
        });
        

        (async function bootModel() {
            if (modelData) {
                try {
                    await assertAssetAvailable(modelData, 'model asset');
                   new GLTFLoader().load(
                       modelData,
                       (gltf) => { setupScene(gltf); },
                       undefined,
                       (error) => { showBootError('Failed to load model', (error && error.message) ? error.message : String(error)); }
                   ); 
                } catch (error) {
                    showBootError('Viewer failed to initialize', error.message || String(error));
                }
            } else {
                document.getElementById('loading-overlay').style.display = 'none';
                showBootError('No model data found in export', 'This viewer cannot render because no model data was bundled.');
            }
        })();
        
        function zoomToExtents() {
            if (!modelObject) {
                if (defaultBookmark) applyView(defaultBookmark);
                return;
            }
            const box = new THREE.Box3().setFromObject(modelObject);
            if (box.isEmpty() || !Number.isFinite(box.min.x)) {
                if (defaultBookmark) applyView(defaultBookmark);
                return;
            }
            const center = new THREE.Vector3();
            box.getCenter(center);
            const sphere = new THREE.Sphere();
            box.getBoundingSphere(sphere);
            const radius = Math.max(sphere.radius, 0.1);

            const aspect = camera.aspect || (window.innerWidth / window.innerHeight);
            const halfFovY = THREE.MathUtils.degToRad(camera.fov) / 2;
            const halfFovX = Math.atan(Math.tan(halfFovY) * aspect);
            const minHalfFov = Math.min(halfFovY, halfFovX);
            const distance = (radius / Math.sin(minHalfFov)) * 1.25;

            const dir = new THREE.Vector3().subVectors(camera.position, controls.target);
            if (dir.lengthSq() < 1e-4) dir.set(0.6, 0.5, 0.8);
            dir.normalize();

            camera.position.copy(center).addScaledVector(dir, distance);
            controls.target.copy(center);
            camera.lookAt(center);
            camera.updateProjectionMatrix();
            controls.update();
            if (smoothZoom) smoothZoom.sync();
            if (cameraController) cameraController.setTarget(controls.target);
            if (anchoredOrbit) anchoredOrbit.setBaseFromCamera();
        }

        window.resetOrFitView = function() {
            if (defaultBookmark) applyView(defaultBookmark);
            else zoomToExtents();
        };

        function updateOcclusion(delta) {
            if (hotspots.length === 0) return;
            const now = performance.now();
            const fadeSpeed = 8.0;
            const total = hotspots.length;

            if (config.hsOcclusion === false) {
                for (let i = 0; i < total; i++) {
                    const h = hotspots[i];
                    if (!h || !h.spriteRef) continue;
                    h._isOccluded = false;
                    h._targetOpacity = config.hsOpacity;
                    if (h.spriteRef.material && Math.abs(h.spriteRef.material.opacity - config.hsOpacity) > 0.005) {
                        h.spriteRef.material.opacity = THREE.MathUtils.lerp(h.spriteRef.material.opacity, config.hsOpacity, 1 - Math.exp(-fadeSpeed * delta));
                    } else if (h.spriteRef.material && h.spriteRef.material.opacity !== config.hsOpacity) {
                        h.spriteRef.material.opacity = config.hsOpacity;
                    }
                }
                return;
            }

            if (!modelObject) return;

            // Dirty tracking: check if camera moved or rotated
            const posDelta = lastCameraPosition.distanceTo(camera.position);
            const rotDelta = lastCameraQuaternion.angleTo(camera.quaternion);
            const timeSinceLastCheck = now - lastOcclusionTime;

            if ((posDelta > 0.08 || rotDelta > 0.015) && timeSinceLastCheck >= 100) {
                lastCameraPosition.copy(camera.position);
                lastCameraQuaternion.copy(camera.quaternion);
                lastOcclusionTime = now;
                pendingOcclusionChecks = total;
            } else if (pendingOcclusionChecks === 0 && (lastCameraPosition.x === Infinity || timeSinceLastCheck > 500)) {
                lastCameraPosition.copy(camera.position);
                lastCameraQuaternion.copy(camera.quaternion);
                lastOcclusionTime = now;
                pendingOcclusionChecks = total;
            }

            // Process pending checks in amortized batches of 1 per frame
            if (pendingOcclusionChecks > 0 && total > 0) {
                const batchSize = Math.min(1, pendingOcclusionChecks, total);
                pendingOcclusionChecks -= batchSize;

                for (let b = 0; b < batchSize; b++) {
                    occlusionRoundRobinIndex = (occlusionRoundRobinIndex + 1) % total;
                    const hotspot = hotspots[occlusionRoundRobinIndex];
                    if (!hotspot || !hotspot.spriteRef) continue;

                    // View-space check: is hotspot behind camera plane?
                    tempCameraPos.copy(hotspot.spriteRef.position).applyMatrix4(camera.matrixWorldInverse);
                    if (tempCameraPos.z > 0) {
                        hotspot._isOccluded = true;
                        hotspot._targetOpacity = 0;
                        continue;
                    }

                    // Frustum screen projection check
                    tempScreenPos.copy(hotspot.spriteRef.position).project(camera);
                    if (Math.abs(tempScreenPos.x) > 1.1 || Math.abs(tempScreenPos.y) > 1.1) {
                        continue; // Off screen: retain existing state without pop-in
                    }

                    const distToSprite = hotspot.spriteRef.position.distanceTo(camera.position);
                    const maxObstacleDist = distToSprite - 0.2;

                    if (maxObstacleDist <= 0) {
                        hotspot._isOccluded = false;
                        hotspot._targetOpacity = config.hsOpacity;
                        continue;
                    }

                    // Raycast candidate
                    raycaster.setFromCamera(tempScreenPos, camera);

                    // AABB early-out: if ray misses model bounding box, it cannot be occluded
                    if (hasModelBox && !raycaster.ray.intersectsBox(modelBox)) {
                        hotspot._isOccluded = false;
                        hotspot._targetOpacity = config.hsOpacity;
                        continue;
                    }

                    // Distance capping
                    raycaster.far = maxObstacleDist;

                    let isOccluded = false;
                    const meshes = cachedMeshes.length > 0 ? cachedMeshes : null;

                    if (meshes) {
                        for (let m = 0; m < meshes.length; m++) {
                            const mesh = meshes[m];
                            if (!mesh.visible) continue;
                            raycastHits.length = 0;
                            mesh.raycast(raycaster, raycastHits);
                            if (raycastHits.length > 0 && raycastHits[0].distance <= maxObstacleDist) {
                                isOccluded = true;
                                break;
                            }
                        }
                    } else {
                        const intersects = raycaster.intersectObject(modelObject, true);
                        if (intersects.length > 0 && intersects[0].distance <= maxObstacleDist) {
                            isOccluded = true;
                        }
                    }

                    raycaster.far = Infinity;

                    hotspot._isOccluded = isOccluded;
                    hotspot._targetOpacity = isOccluded 
                        ? (config.hsOpacity * 0.2) 
                        : config.hsOpacity;
                }
            }

            // Smooth lerp on all hotspots every frame (super fast, no raycasts)
            const t = 1 - Math.exp(-fadeSpeed * delta);
            for (let i = 0; i < total; i++) {
                const h = hotspots[i];
                if (h && h.spriteRef && h.spriteRef.material) {
                    const target = (h._targetOpacity !== undefined) ? h._targetOpacity : config.hsOpacity;
                    const current = (typeof h.spriteRef.material.opacity === 'number') ? h.spriteRef.material.opacity : config.hsOpacity;
                    const diff = target - current;
                    if (Math.abs(diff) > 0.005) {
                        h.spriteRef.material.opacity = THREE.MathUtils.lerp(current, target, t);
                    } else if (current !== target) {
                        h.spriteRef.material.opacity = target;
                    }
                }
            }
        }

        function animate() { 
            requestAnimationFrame(animate); 
            const dt = Math.min(clock.getDelta(), 0.1);
            if (anchoredOrbit) anchoredOrbit.update(dt);
            else {
                if (cameraController) {
                    cameraController.update(dt);
                    if (cameraController.isMoving && smoothZoom) smoothZoom.sync();
                }
                if (smoothZoom) smoothZoom.update(dt);
                controls.update();
            }
            updateHotspotScales(hotspots, markerAnimationState, config.hsSize, dt);
            updateHotspotPos();
            
            // Occlusion
            updateOcclusion(dt);

            renderer.render(scene, camera); 
        }

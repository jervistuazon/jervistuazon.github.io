<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Single HTML Exporter</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101214;
        --panel: #171a1d;
        --panel-2: #202429;
        --text: #f2f0ea;
        --muted: #aeb4b9;
        --line: rgba(255, 255, 255, 0.14);
        --accent: #d4b595;
        --danger: #ff8a8a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(circle at 18% 10%, rgba(212, 181, 149, 0.12), transparent 28rem),
          linear-gradient(135deg, #0c0e10 0%, var(--bg) 58%, #0d1013 100%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      main {
        width: min(980px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      header {
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 5vw, 4.5rem);
        font-weight: 500;
        line-height: 0.96;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
      }

      .tool {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(23, 26, 29, 0.88);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
        overflow: hidden;
      }

      .section {
        padding: clamp(18px, 3vw, 28px);
        border-bottom: 1px solid var(--line);
      }

      .section:last-child {
        border-bottom: 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      input[type="text"] {
        width: 100%;
        height: 46px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 13px;
        color: var(--text);
        background: var(--panel-2);
        font: inherit;
      }

      input[type="file"] {
        width: 100%;
        color: var(--muted);
      }

      .check-row {
        display: flex;
        min-height: 46px;
        align-items: center;
        gap: 10px;
        align-self: end;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 13px;
        background: var(--panel-2);
        color: var(--text);
        letter-spacing: 0;
        text-transform: none;
      }

      .check-row input {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }

      button,
      .download-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        border: 1px solid rgba(212, 181, 149, 0.48);
        border-radius: 6px;
        padding: 0 16px;
        color: #181411;
        background: var(--accent);
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      button.secondary {
        color: var(--text);
        background: transparent;
        border-color: var(--line);
      }

      button:disabled,
      .download-link[hidden] {
        display: none;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      .source-row {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
      }

      .folder-name {
        min-height: 22px;
        color: var(--muted);
      }

      .log {
        display: grid;
        gap: 6px;
        max-height: 230px;
        overflow: auto;
        margin: 14px 0 0;
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0c0e10;
        color: var(--muted);
        font: 0.86rem/1.5 Consolas, "SFMono-Regular", monospace;
        white-space: pre-wrap;
      }

      .error {
        color: var(--danger);
      }

      .note {
        margin-top: 12px;
        font-size: 0.92rem;
      }

      @media (max-width: 720px) {
        main {
          width: min(100vw - 24px, 980px);
          padding: 28px 0;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Single HTML Exporter</h1>
        <p>Package the animated presentation into one client-ready HTML file with embedded video, images, CSS, and JavaScript.</p>
      </header>

      <form class="tool" id="exportForm">
        <section class="section">
          <div class="source-row">
            <button type="button" id="pickFolder">Choose project folder</button>
            <button type="button" class="secondary" id="fallbackPick">Choose folder fallback</button>
            <span class="folder-name" id="folderName">No folder selected</span>
          </div>
          <input id="folderInput" type="file" webkitdirectory directory multiple hidden>
          <p class="note">Pick the folder that contains <strong>index.html</strong>, <strong>styles.css</strong>, <strong>script.js</strong>, <strong>Assets</strong>, and <strong>Video</strong>.</p>
        </section>

        <section class="section grid">
          <label>
            Output file name
            <input id="outputName" type="text" value="animated-presentation.html" autocomplete="off">
          </label>
          <label>
            Browser tab title
            <input id="pageTitle" type="text" value="Aurelia Maldives - Luxury Island Destination" autocomplete="off">
          </label>
          <label>
            Custom favicon
            <input id="favicon" type="file" accept=".ico,.png,.svg,.jpg,.jpeg,.webp,image/*">
          </label>
          <label>
            Startup button text
            <input id="startButtonText" type="text" value="Start Experience" autocomplete="off">
          </label>
          <label class="check-row">
            <input id="startupScreen" type="checkbox" checked>
            Add fullscreen startup button
          </label>
        </section>

        <section class="section">
          <div class="actions">
            <button type="submit" id="exportButton">Build one HTML file</button>
            <a class="download-link" id="downloadLink" hidden>Download HTML</a>
          </div>
          <div class="log" id="log" aria-live="polite"></div>
        </section>
      </form>
    </main>

    <script>
      const pickFolderButton = document.querySelector("#pickFolder");
      const fallbackPickButton = document.querySelector("#fallbackPick");
      const folderInput = document.querySelector("#folderInput");
      const folderName = document.querySelector("#folderName");
      const exportForm = document.querySelector("#exportForm");
      const exportButton = document.querySelector("#exportButton");
      const downloadLink = document.querySelector("#downloadLink");
      const logPanel = document.querySelector("#log");
      const outputNameInput = document.querySelector("#outputName");
      const pageTitleInput = document.querySelector("#pageTitle");
      const faviconInput = document.querySelector("#favicon");
      const startupScreenInput = document.querySelector("#startupScreen");
      const startButtonTextInput = document.querySelector("#startButtonText");

      let source = null;
      let downloadUrl = null;

      fallbackPickButton.hidden = "showDirectoryPicker" in window;

      function log(message, isError = false) {
        const line = document.createElement("div");
        line.textContent = message;
        if (isError) {
          line.className = "error";
        }
        logPanel.append(line);
        logPanel.scrollTop = logPanel.scrollHeight;
      }

      function clearLog() {
        logPanel.textContent = "";
      }

      function normalizePath(path) {
        return path.replace(/\\/g, "/").replace(/^\.?\//, "");
      }

      function stripUrl(url) {
        return decodeURIComponent(url.split("#")[0].split("?")[0]).replace(/\\/g, "/").replace(/^\.?\//, "");
      }

      function isLocalAssetUrl(url) {
        const value = (url || "").trim();
        const decodedValue = (() => {
          try {
            return decodeURIComponent(value);
          } catch (error) {
            return value;
          }
        })();
        return Boolean(value) &&
          !value.startsWith("#") &&
          !decodedValue.startsWith("#") &&
          !/^(data:|blob:|https?:|mailto:|tel:|javascript:)/i.test(value);
      }

      function mimeFromName(name) {
        const extension = name.split(".").pop().toLowerCase();
        const types = {
          avif: "image/avif",
          css: "text/css",
          gif: "image/gif",
          html: "text/html",
          ico: "image/x-icon",
          jpeg: "image/jpeg",
          jpg: "image/jpeg",
          js: "text/javascript",
          m4v: "video/mp4",
          mp4: "video/mp4",
          png: "image/png",
          svg: "image/svg+xml",
          webm: "video/webm",
          webp: "image/webp",
          woff: "font/woff",
          woff2: "font/woff2",
        };
        return types[extension] || "application/octet-stream";
      }

      async function blobToDataUri(blob, fallbackName) {
        const mime = blob.type || mimeFromName(fallbackName);
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.addEventListener("load", () => resolve(reader.result));
          reader.addEventListener("error", () => reject(reader.error));
          reader.readAsDataURL(blob);
        });

        if (blob.type || dataUrl.startsWith(`data:${mime};`)) {
          return dataUrl;
        }

        return dataUrl.replace(/^data:[^;]+;/, `data:${mime};`);
      }

      async function getFileFromHandle(rootHandle, path) {
        const parts = stripUrl(path).split("/").filter(Boolean);
        let current = rootHandle;

        for (let index = 0; index < parts.length - 1; index += 1) {
          current = await current.getDirectoryHandle(parts[index]);
        }

        return current.getFileHandle(parts[parts.length - 1]).then((handle) => handle.getFile());
      }

      function createFileMap(files) {
        const map = new Map();
        for (const file of files) {
          const rawPath = file.webkitRelativePath || file.name;
          const withoutRoot = rawPath.split("/").slice(1).join("/") || rawPath;
          map.set(normalizePath(withoutRoot).toLowerCase(), file);
        }
        return map;
      }

      async function getSourceFile(path) {
        const cleanPath = stripUrl(path);

        if (!source) {
          throw new Error("Choose the project folder first.");
        }

        if (source.type === "directory") {
          return getFileFromHandle(source.handle, cleanPath);
        }

        const file = source.files.get(cleanPath.toLowerCase());
        if (!file) {
          throw new Error(`Missing file: ${cleanPath}`);
        }
        return file;
      }

      async function readText(path) {
        const file = await getSourceFile(path);
        return file.text();
      }

      async function readDataUri(path) {
        const file = await getSourceFile(path);
        return blobToDataUri(file, path);
      }

      function escapeStyleEnd(css) {
        return css.replace(/<\/style/gi, "<\\/style");
      }

      function escapeScriptEnd(script) {
        return script.replace(/<\/script/gi, "<\\/script");
      }

      async function inlineCssAssets(css, cssPath) {
        const base = cssPath.split("/").slice(0, -1).join("/");
        const matches = Array.from(css.matchAll(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g));
        let nextCss = css;

        for (const match of matches) {
          const url = match[2].trim();
          if (!isLocalAssetUrl(url)) {
            continue;
          }

          const assetPath = normalizePath(`${base ? `${base}/` : ""}${stripUrl(url)}`);
          const dataUri = await readDataUri(assetPath);
          nextCss = nextCss.replace(match[0], `url("${dataUri}")`);
          log(`Embedded CSS asset: ${assetPath}`);
        }

        return nextCss;
      }

      function setDocumentTitle(doc, title) {
        const cleanTitle = title.trim();
        if (!cleanTitle) {
          return;
        }

        let titleElement = doc.querySelector("title");
        if (!titleElement) {
          titleElement = doc.createElement("title");
          doc.head.prepend(titleElement);
        }
        titleElement.textContent = cleanTitle;
      }

      async function setFavicon(doc) {
        const file = faviconInput.files[0];
        if (!file) {
          return;
        }

        doc.querySelectorAll('link[rel~="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]').forEach((link) => link.remove());
        const icon = doc.createElement("link");
        icon.rel = "icon";
        icon.href = await blobToDataUri(file, file.name);
        doc.head.append(icon);
        log(`Embedded favicon: ${file.name}`);
      }

      function injectStartupGate(doc) {
        if (!startupScreenInput.checked) {
          return;
        }

        const buttonText = startButtonTextInput.value.trim() || "Start Experience";
        const style = doc.createElement("style");
        style.setAttribute("data-startup-gate", "");
        style.textContent = `
body[data-startup-locked] {
  overflow: hidden;
}

.startup-gate {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: grid;
  place-items: center;
  padding: 32px;
  color: #f4f4f0;
  background:
    radial-gradient(circle at 50% 42%, rgba(212, 181, 149, 0.14), transparent 24rem),
    linear-gradient(180deg, rgba(4, 5, 6, 0.82), rgba(4, 5, 6, 0.96));
  transition: opacity 520ms cubic-bezier(0.16, 1, 0.3, 1), visibility 520ms linear;
}

.startup-gate.is-dismissed {
  opacity: 0;
  visibility: hidden;
}

.startup-gate__inner {
  display: grid;
  gap: 18px;
  justify-items: center;
}

.startup-gate__line {
  width: 84px;
  height: 1px;
  background: rgba(212, 181, 149, 0.68);
  box-shadow: 0 0 18px rgba(212, 181, 149, 0.28);
}

.startup-gate__button {
  min-width: 162px;
  min-height: 50px;
  border: 1px solid rgba(212, 181, 149, 0.62);
  border-radius: 999px;
  padding: 0 26px;
  color: #f4f4f0;
  background: rgba(212, 181, 149, 0.08);
  font: 600 0.78rem/1 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.34);
  transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
}

.startup-gate__button:hover,
.startup-gate__button:focus-visible {
  border-color: #d4b595;
  background: rgba(212, 181, 149, 0.17);
  outline: none;
  transform: translateY(-1px);
}`;

        const gate = doc.createElement("div");
        gate.className = "startup-gate";
        gate.setAttribute("data-startup-gate", "");
        gate.setAttribute("role", "dialog");
        gate.setAttribute("aria-modal", "true");
        gate.setAttribute("aria-label", "Start presentation");
        gate.innerHTML = '<div class="startup-gate__inner"><span class="startup-gate__line" aria-hidden="true"></span><button class="startup-gate__button" type="button" data-startup-button></button></div>';
        gate.querySelector("button").textContent = buttonText;

        const script = doc.createElement("script");
        script.setAttribute("data-startup-gate", "");
        script.textContent = `(function () {
  var gate = document.querySelector(".startup-gate[data-startup-gate]");
  var button = document.querySelector("[data-startup-button]");
  if (!gate || !button) return;

  function requestFullscreen() {
    var element = document.documentElement;
    var request = element.requestFullscreen ||
      element.webkitRequestFullscreen ||
      element.msRequestFullscreen;

    if (!request) {
      return Promise.resolve();
    }

    try {
      return Promise.resolve(request.call(element)).catch(function () {});
    } catch (error) {
      return Promise.resolve();
    }
  }

  function openPresentation() {
    requestFullscreen().then(function () {
      gate.classList.add("is-dismissed");
      document.body.removeAttribute("data-startup-locked");
      window.scrollTo(0, 0);
      window.dispatchEvent(new Event("resize"));
      window.dispatchEvent(new Event("scroll"));
      window.setTimeout(function () {
        gate.remove();
      }, 540);
    });
  }

  button.addEventListener("click", openPresentation, { once: true });
  button.focus({ preventScroll: true });
})();`;

        doc.head.append(style);
        doc.body.setAttribute("data-startup-locked", "");
        doc.body.prepend(gate);
        doc.body.append(script);
        log("Added fullscreen startup button.");
      }

      async function inlineStylesheets(doc) {
        const links = Array.from(doc.querySelectorAll('link[rel="stylesheet"][href]'));
        for (const link of links) {
          const href = link.getAttribute("href");
          if (!isLocalAssetUrl(href)) {
            continue;
          }

          const cssPath = stripUrl(href);
          const css = await readText(cssPath);
          const inlinedCss = await inlineCssAssets(css, cssPath);
          const style = doc.createElement("style");
          style.setAttribute("data-inlined-from", href);
          style.textContent = escapeStyleEnd(inlinedCss);
          link.replaceWith(style);
          log(`Inlined stylesheet: ${cssPath}`);
        }
      }

      async function inlineScripts(doc) {
        const scripts = Array.from(doc.querySelectorAll("script[src]"));
        for (const script of scripts) {
          const src = script.getAttribute("src");
          if (!isLocalAssetUrl(src)) {
            continue;
          }

          const scriptPath = stripUrl(src);
          const code = await readText(scriptPath);
          const nextScript = doc.createElement("script");
          nextScript.setAttribute("data-inlined-from", src);
          nextScript.textContent = escapeScriptEnd(code);
          script.replaceWith(nextScript);
          log(`Inlined script: ${scriptPath}`);
        }
      }

      async function inlineMediaAndImages(doc) {
        const elements = Array.from(doc.querySelectorAll("[src], [poster]"));
        for (const element of elements) {
          for (const attribute of ["src", "poster"]) {
            if (!element.hasAttribute(attribute)) {
              continue;
            }

            const value = element.getAttribute(attribute);
            if (!isLocalAssetUrl(value)) {
              continue;
            }

            const assetPath = stripUrl(value);
            element.setAttribute(attribute, await readDataUri(assetPath));
            log(`Embedded asset: ${assetPath}`);
          }
        }
      }

      function getOutputName() {
        const raw = outputNameInput.value.trim() || "animated-presentation.html";
        return raw.toLowerCase().endsWith(".html") ? raw : `${raw}.html`;
      }

      function makeDownload(html) {
        if (downloadUrl) {
          URL.revokeObjectURL(downloadUrl);
        }

        const blob = new Blob([html], { type: "text/html;charset=utf-8" });
        downloadUrl = URL.createObjectURL(blob);
        downloadLink.href = downloadUrl;
        downloadLink.download = getOutputName();
        downloadLink.hidden = false;
        log(`Ready: ${getOutputName()} (${(blob.size / 1024 / 1024).toFixed(2)} MB)`);
      }

      async function loadDetectedTitle() {
        try {
          const indexHtml = await readText("index.html");
          const match = indexHtml.match(/<title>([\s\S]*?)<\/title>/i);
          if (match && match[1].trim()) {
            pageTitleInput.value = match[1].trim();
          }
        } catch (error) {
          log(error.message, true);
        }
      }

      pickFolderButton.addEventListener("click", async () => {
        clearLog();
        downloadLink.hidden = true;

        if (!("showDirectoryPicker" in window)) {
          folderInput.click();
          return;
        }

        try {
          const handle = await window.showDirectoryPicker();
          source = { type: "directory", handle };
          folderName.textContent = handle.name;
          log(`Selected folder: ${handle.name}`);
          await loadDetectedTitle();
        } catch (error) {
          if (error.name !== "AbortError") {
            log(error.message, true);
          }
        }
      });

      fallbackPickButton.addEventListener("click", () => {
        folderInput.click();
      });

      folderInput.addEventListener("change", async () => {
        clearLog();
        downloadLink.hidden = true;

        const files = Array.from(folderInput.files);
        if (!files.length) {
          return;
        }

        source = { type: "file-list", files: createFileMap(files) };
        folderName.textContent = files[0].webkitRelativePath.split("/")[0] || "Selected folder";
        log(`Selected ${files.length} files.`);
        await loadDetectedTitle();
      });

      exportForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearLog();
        downloadLink.hidden = true;
        exportButton.disabled = true;

        try {
          log("Reading index.html");
          const indexHtml = await readText("index.html");
          const doc = new DOMParser().parseFromString(indexHtml, "text/html");

          setDocumentTitle(doc, pageTitleInput.value);
          await setFavicon(doc);
          injectStartupGate(doc);
          await inlineStylesheets(doc);
          await inlineScripts(doc);
          await inlineMediaAndImages(doc);

          const html = `<!doctype html>\n${doc.documentElement.outerHTML}`;
          makeDownload(html);
        } catch (error) {
          log(error.message, true);
        } finally {
          exportButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
